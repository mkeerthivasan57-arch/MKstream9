<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title id="site-title">MKstream</title>
<meta name="description" id="meta-desc" content="MKstream - Watch anime, donghua, cartoons, serials, web series, movies">
<link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
</head>
<body class="theme-dark">
  <div class="site-root">
    <header class="site-header">
      <div class="left">
        <button id="hamburger" class="hamburger" aria-label="menu" aria-expanded="false"><span></span><span></span><span></span></button>
        <div id="brand" class="brand" role="button" tabindex="0">MKstream</div>
      </div>

      <nav class="categories-desktop" id="categories-desktop" aria-hidden="false"></nav>

      <div class="right">
        <button id="search-toggle" class="icon-btn" aria-label="search">🔍</button>
        <a id="admin-open" class="admin-pill" href="admin.html">Admin</a>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="sidebar-top">
        <div class="brand">MKstream</div>
        <button id="sidebar-close" class="close-x" aria-label="Close menu">✖</button>
      </div>
      <div id="sidebar-links" class="sidebar-links">
        <button class="side-link" data-link="index.html">🏠 Home</button>
      </div>
      <hr>
      <div class="sidebar-cats" id="sidebar-cats"></div>
    </aside>

    <div id="search-overlay" class="overlay hidden" role="dialog" aria-hidden="true">
      <div class="overlay-inner">
        <div class="search-row">
          <input id="search-input" class="input" placeholder="Search series or episodes..." autofocus>
          <button id="search-close" class="btn">Close</button>
        </div>
        <div id="search-results"></div>
      </div>
    </div>

    <main class="container">
      <section id="specials" class="section">
        <h2>Today's Specials</h2>
        <div id="specials-grid" class="grid"></div>
      </section>

      <section id="recent" class="section">
        <h2>Recently Uploaded</h2>
        <div id="recent-grid" class="grid"></div>
        <div class="pager center"><button id="recent-load-more" class="btn">Load more</button></div>
      </section>

      <section id="most" class="section">
        <h2>Most Viewed</h2>
        <div id="most-grid" class="grid"></div>
        <div class="pager center"><button id="most-load-more" class="btn">Load more</button></div>
      </section>
    </main>

    <footer class="site-footer"><div class="container small">MKstream © <span id="year">2025</span>. All rights reserved.</div></footer>
  </div>
</body>
</html>
